# 人工回归清单。当前无自动化 harness：改完 SKILL.md 后，任取 L1/L2/L3 各一条
# 实际跑一遍 /deep-bagu，人工比对档位、必含项、行数上限与禁止类别。
# forbidden_categories 取值必须来自 references/terms.md 第 1 节，不得自造类别。

cases:
  - id: jvm_oom
    input: "线上 Java 服务频繁 Full GC 后 OOM，如何排查和调优"
    expected_tier: L3
    must_include:
      - "GC 日志字段"
      - "jstat 或 jcmd 采集"
      - "堆 dump 风险提示"
      - "版本标注"
      - "回滚条件"
    forbidden_categories:
      - 伪造细节类
      - 危险操作无提示类
      - 变更缺回滚类
    max_lines: 250

  - id: simple_concept
    input: "解释一下什么是 TLAB"
    expected_tier: L1
    must_include:
      - "一句话本质"
      - "关键机制"
      - "一个可核对验证方式"
    forbidden_categories:
      - 答题口吻类
      - 求职考核类
    max_lines: 40

  - id: mysql_deadlock
    input: "MySQL 线上偶发死锁，如何定位和解决"
    expected_tier: L2
    must_include:
      - "innodb status"
      - "锁等待"
      - "执行计划"
      - "事务边界"
    forbidden_categories:
      - 伪造细节类
      - 危险操作无提示类
    max_lines: 120

  - id: redis_hotkey
    input: "Redis 集群出现热 key，如何排查和治理"
    expected_tier: L2
    must_include:
      - "INFO 指标"
      - "slowlog"
      - "热 key 采样"
      - "SCAN 限频"
    forbidden_categories:
      - 危险操作无提示类
      - 夸大承诺类
    max_lines: 120

  - id: spring_circular_dependency
    input: "Spring 循环依赖是怎么处理的，线上启动失败怎么排查"
    expected_tier: L2
    must_include:
      - "Bean 生命周期"
      - "代理链"
      - "启动日志"
      - "版本差异"
    forbidden_categories:
      - 伪造细节类
      - 答题口吻类
    max_lines: 120

  - id: distributed_retry_storm
    input: "分布式调用超时重试导致雪崩，如何设计防护"
    expected_tier: L2
    must_include:
      - "超时"
      - "重试退避"
      - "幂等"
      - "熔断降级"
      - "压测指标"
    forbidden_categories:
      - 夸大承诺类
      - 变更缺回滚类
    max_lines: 120
