# 人工回归清单。当前无自动化 harness：改完 SKILL.md 后，任取 L1/L2/L3 各一条
# 实际跑一遍 /deep-bagu，人工比对档位、必含项、行数上限与禁止类别。
# forbidden_categories 取值必须来自 references/terms.md 第 1 节，不得自造类别。

cases:
  - id: jvm_oom
    input: "线上 Java 服务频繁 Full GC 后 OOM，如何排查和调优"
    expected_tier: L3
    must_include:
      - "一句话结论"
      - "GC 日志字段"
      - "jstat 或 jcmd 采集"
      - "可复现示例或参数"
      - "观察点（GC 字段或线程栈）"
      - "版本标注"
      - "回滚条件"
    forbidden_categories:
      - 伪造细节类
      - 危险操作无提示类
      - 变更缺回滚类
    max_lines: 250

  - id: simple_concept
    input: "解释一下什么是 TLAB"
    expected_tier: L1
    must_include:
      - "一句话结论"
      - "关键机制"
      - "一个可核对验证方式"
      - "一个坑"
    forbidden_categories:
      - 答题口吻类
      - 求职考核类
    max_lines: 40

  - id: mysql_deadlock
    input: "MySQL 线上偶发死锁，如何定位和解决"
    expected_tier: L2
    must_include:
      - "一句话结论"
      - "可复现的建表与 SQL"
      - "innodb status"
      - "锁等待"
      - "执行计划"
      - "事务边界"
    forbidden_categories:
      - 伪造细节类
      - 危险操作无提示类
    max_lines: 120

  - id: redis_hotkey
    input: "Redis 集群出现热 key，如何排查和治理"
    expected_tier: L2
    must_include:
      - "一句话结论"
      - "INFO 指标"
      - "slowlog"
      - "热 key 采样"
      - "SCAN 限频"
    forbidden_categories:
      - 危险操作无提示类
      - 夸大承诺类
    max_lines: 120

  - id: spring_circular_dependency
    input: "Spring 循环依赖是怎么解决的"
    expected_tier: L2
    must_include:
      - "一句话结论"
      - "三级缓存"
      - "可运行的最小示例"
      - "BREAKPOINT 或断点位置"
      - "观察变量"
      - "版本差异"
    forbidden_categories:
      - 伪造细节类
      - 答题口吻类
    max_lines: 120

  - id: spring_demo_boundary
    input: "Spring 循环依赖是怎么解决的，给我建个能打断点的 demo"
    expected_tier: L2
    must_include:
      - "文件清单"
      - "运行命令"
      - "断点位置"
      - "预期输出"
    forbidden_categories:
      - 伪造细节类
    max_lines: 250

  - id: no_demo_by_default
    input: "AQS 的 CLH 队列是怎么工作的"
    expected_tier: L2
    must_include:
      - "一句话结论"
      - "可运行示例"
      - "断点位置"
      - "未创建文件"
    forbidden_categories:
      - 答题口吻类
      - 伪造细节类
    max_lines: 120

  - id: distributed_retry_storm
    input: "分布式调用超时重试导致雪崩，如何设计防护"
    expected_tier: L2
    must_include:
      - "超时"
      - "重试退避"
      - "幂等"
      - "熔断降级"
      - "压测指标"
    forbidden_categories:
      - 夸大承诺类
      - 变更缺回滚类
    max_lines: 120
